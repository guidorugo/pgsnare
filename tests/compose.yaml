# SPDX-License-Identifier: Apache-2.0
#
# PostgreSQL 15 to 18 and pgsnare for the integration tests: `make itest`.
#
# Nothing here publishes a host port, and the network has no route to the
# outside. The password is generated for each run by tests/itest.sh and is
# never stored. Images are pinned by tag and by digest.
#
# The services, in the order tests/itest.sh uses them:
#
#   setup     runs once and writes certificates and the configuration of
#             pgsnare to the `state` volume: tests/proxy/setup.sh
#   pgNN      the databases, each with TLS on and its Unix socket in a
#             volume that pgsnare mounts too
#   pglegacy  a database that speaks no TLS version above 1.1, to show
#             that pgsnare refuses one
#   offline   the pgsnare binary in a container without a network and
#             without a place to write to, for `token generate`
#   pgsnare   one proxy in front of all of them, with a listener for each
#             database and each TLS setup. It runs the binary that
#             `make itest` built, in a container with a read-only root
#             filesystem and no capabilities.
#   client    runs the test scripts, such as the differential runner
#             tests/differential/run.sh, and is started once for each. It
#             has the pgsnare binary as well, for the checks of what the
#             commands print: tests/bait/check.sh
#
# Every container runs as the user `postgres` of its image, which has the
# same id in all of them. A file one of them writes to a volume therefore
# belongs to the user that reads it in another, which is what the access
# rules of both PostgreSQL and pgsnare ask for.

name: pgsnare-itest

x-postgres: &postgres
  user: postgres
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  environment:
    POSTGRES_PASSWORD: ${PGSNARE_ITEST_PASSWORD:?run the tests with make itest}
    POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
  healthcheck:
    # Over TCP, so the check passes only once the server accepts clients and
    # not while it is still being initialised.
    test: ["CMD", "pg_isready", "--host", "127.0.0.1", "--username", "postgres", "--dbname", "postgres"]
    interval: 1s
    timeout: 3s
    retries: 120
  networks:
    - itest

services:
  setup:
    image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    profiles:
      - setup
    user: postgres
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    network_mode: none
    entrypoint: ["/proxy/setup.sh"]
    environment:
      ITEST_VERSIONS: ${ITEST_VERSIONS:?run the tests with make itest}
    volumes:
      # A new volume takes the owner of the directory it is first mounted
      # on. This one belongs to `postgres` in the image, so the volume is
      # writable without a container that runs as root.
      - state:/var/lib/postgresql
      - ./proxy:/proxy:ro

  pgsnare: &pgsnare
    image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    user: postgres
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    # pgsnare is process 1 of its container: nothing starts it and nothing
    # passes signals on to it.
    init: false
    entrypoint: ["/usr/local/bin/pgsnare"]
    command: ["run", "--config", "/state/config/pgsnare.yaml"]
    # Less than one of the 100 MB messages the scenarios send through it.
    # A proxy that held such a message would be stopped by the kernel.
    mem_limit: 64m
    memswap_limit: 64m
    environment:
      # The system's certificate store, for the listeners that name no
      # authority of their own.
      SSL_CERT_FILE: /state/certs/ca.crt
    volumes:
      - ${ITEST_BINARY:?run the tests with make itest}:/usr/local/bin/pgsnare:ro
      - state:/state:ro
      - socket15:/sockets/pg15:ro
      - socket16:/sockets/pg16:ro
      - socket17:/sockets/pg17:ro
      - socket18:/sockets/pg18:ro
    healthcheck:
      # Through the proxy, so the check passes only once pgsnare relays to
      # a database that accepts clients.
      test: ["CMD", "pg_isready", "--host", "127.0.0.1", "--port", "${ITEST_READY_PORT:?run the tests with make itest}", "--username", "postgres", "--dbname", "postgres"]
      interval: 1s
      timeout: 3s
      retries: 120
    networks:
      - itest

  # Two more of the same, each with a limit on the processors it may use.
  # They only have to start: what counts is how many worker threads each
  # says it runs.
  pgsnare-one-cpu:
    <<: *pgsnare
    profiles:
      - limits
    cpus: 1
    healthcheck:
      disable: true

  pgsnare-two-cpus:
    <<: *pgsnare
    profiles:
      - limits
    cpus: 2
    healthcheck:
      disable: true

  # The binary once more, in a container without a network and without a
  # place to write to, for the commands that must need neither.
  offline:
    image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    profiles:
      - offline
    user: postgres
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    network_mode: none
    entrypoint: ["/usr/local/bin/pgsnare"]
    volumes:
      - ${ITEST_BINARY:?run the tests with make itest}:/usr/local/bin/pgsnare:ro

  pg15:
    <<: *postgres
    image: postgres:15.19-trixie@sha256:1aac5b49cefd627f02816141ca4ad012d6cc19460dfe02a9b5168a105be3fc53
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/state/certs/pg15.crt
      - -c
      - ssl_key_file=/state/certs/pg15.key
      # For the scenario with a logical replication stream.
      - -c
      - wal_level=logical
    volumes:
      - state:/state:ro
      - socket15:/var/run/postgresql

  pg16:
    <<: *postgres
    image: postgres:16.15-trixie@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/state/certs/pg16.crt
      - -c
      - ssl_key_file=/state/certs/pg16.key
      # For the scenario with a logical replication stream.
      - -c
      - wal_level=logical
    volumes:
      - state:/state:ro
      - socket16:/var/run/postgresql

  pg17:
    <<: *postgres
    image: postgres:17.11-trixie@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/state/certs/pg17.crt
      - -c
      - ssl_key_file=/state/certs/pg17.key
      # For the scenario with a logical replication stream.
      - -c
      - wal_level=logical
    volumes:
      - state:/state:ro
      - socket17:/var/run/postgresql

  pg18:
    <<: *postgres
    image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/state/certs/pg18.crt
      - -c
      - ssl_key_file=/state/certs/pg18.key
      # For the scenario with a logical replication stream.
      - -c
      - wal_level=logical
    volumes:
      - state:/state:ro
      - socket18:/var/run/postgresql

  pglegacy:
    <<: *postgres
    image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/state/certs/pglegacy.crt
      - -c
      - ssl_key_file=/state/certs/pglegacy.key
      # TLS 1.1 at most, which the TLS library only does at its lowest
      # security level.
      - -c
      - ssl_min_protocol_version=TLSv1
      - -c
      - ssl_max_protocol_version=TLSv1.1
      - -c
      - ssl_ciphers=DEFAULT@SECLEVEL=0
    volumes:
      - state:/state:ro

  client:
    image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    profiles:
      - client
    user: postgres
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    entrypoint: ["/differential/run.sh"]
    environment:
      PGPASSWORD: ${PGSNARE_ITEST_PASSWORD:?run the tests with make itest}
    volumes:
      # The binary under test, for the checks of what its commands print:
      # tests/bait/check.sh.
      - ${ITEST_BINARY:?run the tests with make itest}:/usr/local/bin/pgsnare:ro
      - ./bait:/bait:ro
      - ./differential:/differential:ro
      - ./login:/login:ro
      - state:/state:ro
    networks:
      - itest

volumes:
  state:
  socket15:
  socket16:
  socket17:
  socket18:

networks:
  itest:
    internal: true
