# SPDX-License-Identifier: Apache-2.0
#
# PostgreSQL 15 to 18 for the integration tests: `make itest`.
#
# Nothing here publishes a host port, and the network has no route to the
# outside. The password is generated for each run by tests/itest.sh and is
# never stored. Images are pinned by tag and by digest.
#
# The `client` service is not started with the databases. It runs the
# differential runner: tests/differential/run.sh.

name: pgsnare-itest

x-postgres: &postgres
  user: postgres
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  environment:
    POSTGRES_PASSWORD: ${PGSNARE_ITEST_PASSWORD:?run the tests with make itest}
    POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
  healthcheck:
    # Over TCP, so the check passes only once the server accepts clients and
    # not while it is still being initialised.
    test: ["CMD", "pg_isready", "--host", "127.0.0.1", "--username", "postgres", "--dbname", "postgres"]
    interval: 1s
    timeout: 3s
    retries: 120
  networks:
    - itest

services:
  pg15:
    <<: *postgres
    image: postgres:18.4-trixie@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636

  pg16:
    <<: *postgres
    image: postgres:18.4-trixie@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636

  pg17:
    <<: *postgres
    image: postgres:18.4-trixie@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636

  pg18:
    <<: *postgres
    image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42

  client:
    image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    profiles:
      - client
    user: postgres
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    entrypoint: ["/differential/run.sh"]
    environment:
      PGPASSWORD: ${PGSNARE_ITEST_PASSWORD:?run the tests with make itest}
    volumes:
      - ./differential:/differential:ro
    networks:
      - itest

networks:
  itest:
    internal: true
