# SPDX-License-Identifier: Apache-2.0
#
# Rules that find private network addresses, for gitleaks. `make scan` runs
# them over every file and every commit, with no exceptions: comments that
# silence gitleaks and ignore files are not honoured for these rules.
#
# Flagged: the IPv4 private ranges of RFC 1918, IPv4 and IPv6 link-local
# addresses, and IPv6 unique local addresses. Examples and tests use the
# reserved documentation ranges instead, which these rules do not match.
#
# This file is scanned by its own rules, so it names the ranges and never
# writes one out.

title = "pgsnare private network address scan"

# An address counts only when it stands alone: not inside a longer dotted
# number such as a version or an object identifier.

[[rules]]
id = "private-ipv4-address"
description = "Private IPv4 address (RFC 1918)"
regex = '''(?:^|[^0-9.]|(?:^|[^0-9])\.)((?:10\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])|172\.(?:1[6-9]|2[0-9]|3[01])|192\.168)\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9]))(?:[^0-9.]|\.(?:[^0-9]|$)|$)'''
secretGroup = 1

[[rules]]
id = "link-local-ipv4-address"
description = "Link-local IPv4 address (RFC 3927)"
regex = '''(?:^|[^0-9.]|(?:^|[^0-9])\.)(169\.254\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9]))(?:[^0-9.]|\.(?:[^0-9]|$)|$)'''
secretGroup = 1

[[rules]]
id = "unique-local-ipv6-address"
description = "Unique local IPv6 address (RFC 4193)"
regex = '''(?i)(?:^|[^0-9a-z:.])(f[cd][0-9a-f]{2}(?::[0-9a-f]{0,4}){2,7})'''
secretGroup = 1

[[rules]]
id = "link-local-ipv6-address"
description = "Link-local IPv6 address (RFC 4291)"
regex = '''(?i)(?:^|[^0-9a-z:.])(fe[89ab][0-9a-f](?::[0-9a-f]{0,4}){2,7})'''
secretGroup = 1
