# An account of its own, with no role and no token in the pod: pgsnare
# never talks to the API of the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pgsnare.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "pgsnare.labels" . | nindent 4 }}
automountServiceAccountToken: false
