#
# A pod that the restricted Pod Security Standard does not allow. It is
# never started: install.sh only asks the cluster whether it would be
# admitted, and expects a refusal in the namespace of pgsnare.
apiVersion: v1
kind: Pod
metadata:
  name: privileged
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: privileged
      image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
      command: ["sleep", "infinity"]
      securityContext:
        privileged: true
