[package]
name = "pgsnare"
description = "A PostgreSQL proxy that detects data theft with honeytokens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["rules"]
# Optional SQL rules. A build without this feature does not contain the SQL
# parser, which is C code.
rules = ["pgsnare-core/rules"]

[dependencies]
aho-corasick.workspace = true
aws-lc-rs.workspace = true
clap.workspace = true
hyper.workspace = true
pgsnare-core.workspace = true
rustix.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
rcgen.workspace = true
# Tests stop the clock, so that a window of a minute takes no time.
tokio = { workspace = true, features = ["test-util"] }
