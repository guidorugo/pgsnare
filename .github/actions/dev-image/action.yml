#
# Provides the development image (Dockerfile.dev) to a job: restored from
# the cache when this exact Dockerfile was built before, built otherwise.
# The repository must be checked out first.

name: Development image
description: Build the development image, or restore it from the cache.

runs:
  using: composite
  steps:
    - name: Restore the image from the cache
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/pgsnare-dev-image.tar.zst
        key: dev-image-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile.dev') }}

    - name: Load the cached image
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: zstd --decompress --stdout "$RUNNER_TEMP/pgsnare-dev-image.tar.zst" | docker load

    # Does nothing when the image was loaded from the cache.
    - name: Build the image
      shell: bash
      run: make image

    - name: Save the image for the cache
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        tag="pgsnare-dev:$(cksum Dockerfile.dev | cut -d' ' -f1)"
        docker save "$tag" | zstd -T0 -3 > "$RUNNER_TEMP/pgsnare-dev-image.tar.zst"
