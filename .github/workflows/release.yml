# SPDX-License-Identifier: Apache-2.0
#
# A release of pgsnare: the binaries, the image and the chart, built from
# one tagged commit, signed, and published with checksums, SBOMs and build
# provenance. docs/releasing.md is the procedure, and
# docs/verifying-a-release.md is what a user does with the result.
#
# It runs when a version tag is pushed, and for no other reason.
#
# The jobs:
#
#   check       the tag is a version, the version of Cargo.toml, and on a
#               commit of the main branch: deploy/release/check-tag.sh
#   build       deploy/Dockerfile, natively on each architecture, from
#               nothing: no cache is restored
#   image-test  deploy/tests/image/test.sh, on what was built
#   image-scan  deploy/tests/scan/scan.sh, on what was built
#   publish     deploy/release/publish.sh, then the build provenance, then
#               a draft of the release
#   verify      deploy/release/verify.sh, against what was published
#
# The jobs that compile and build can only read. Build scripts of
# dependencies run in them, and there is nothing there to take: no token
# that can write, and no identity to sign with.
#
# `publish` is the only job that can write. It compiles nothing and builds
# no image: it takes what `build` made, checks it against the sums `build`
# reported, and runs tools from deploy/tools/tools.txt, each installed by
# checksum. It runs in the environment `release`, which the owner protects
# with a required reviewer.
#
# No expression is written into a script: a value reaches a script through
# `env`, and the script checks it against a pattern before using it.

name: release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

# One release at a time, and a release that has started is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # The image becomes REGISTRY/pgsnare and the chart REGISTRY/charts/pgsnare.
  REGISTRY: ghcr.io/guidorugo

jobs:
  check:
    name: check
    if: github.repository == 'guidorugo/pgsnare'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the check asks whether the commit is on main.
          fetch-depth: 0
      - name: The tag is a version, the version of Cargo.toml, on a commit of main
        id: tag
        run: deploy/release/check-tag.sh "$GITHUB_REF" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.arch }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      ARCH: ${{ matrix.arch }}
    outputs:
      sums_amd64: ${{ steps.sums.outputs.sums_amd64 }}
      sums_arm64: ${{ steps.sums.outputs.sums_arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image and export the binary
        run: deploy/tests/image/build.sh "$RUNNER_TEMP/image" "$ARCH"
      - name: Report the sum of the sums to the job that publishes
        id: sums
        working-directory: ${{ runner.temp }}/image
        run: echo "sums_$ARCH=$(sha256sum "SHA256SUMS-$ARCH" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Hand the image to the other jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image/
          if-no-files-found: error
          retention-days: 7

  image-test:
    name: image-test (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Take the image from the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image
      - name: Check the archive against its sums
        working-directory: ${{ runner.temp }}/image
        run: sha256sum --check --strict "SHA256SUMS-$ARCH"
      - name: Test the image as the registry hands it out
        run: |
          deploy/tests/registry/start.sh
          image="$(deploy/tests/registry/load.sh "$RUNNER_TEMP/image/pgsnare-image-$ARCH.tar")"
          deploy/tests/image/test.sh "$image" "$RUNNER_TEMP/image/pgsnare-$ARCH"

  image-scan:
    name: image-scan (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Take the image from the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image
      - name: Check the archive against its sums
        working-directory: ${{ runner.temp }}/image
        run: sha256sum --check --strict "SHA256SUMS-$ARCH"
      - name: Install the scanner from the tool list
        run: deploy/tools/install.sh "$RUNNER_TEMP/bin" grype
      - name: Scan the image for known vulnerabilities
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          deploy/tests/registry/start.sh
          image="$(deploy/tests/registry/load.sh "$RUNNER_TEMP/image/pgsnare-image-$ARCH.tar")"
          deploy/tests/scan/scan.sh "$image"

  publish:
    name: publish
    needs: [check, build, image-test, image-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      BUILD_SUMS_AMD64: ${{ needs.build.outputs.sums_amd64 }}
      BUILD_SUMS_ARM64: ${{ needs.build.outputs.sums_arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Take the amd64 image from the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-amd64
          path: ${{ runner.temp }}/image
      - name: Take the arm64 image from the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-arm64
          path: ${{ runner.temp }}/image
      - name: Install the release tools from the tool list
        run: deploy/tools/install.sh "$RUNNER_TEMP/bin" crane cosign syft helm
      - name: Log in to the registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          host="${REGISTRY%%/*}"
          crane auth login "$host" --username "$GITHUB_ACTOR" --password-stdin <<<"$REGISTRY_TOKEN"
          helm registry login "$host" --username "$GITHUB_ACTOR" --password-stdin <<<"$REGISTRY_TOKEN"
      - name: Publish and sign the image, the chart and the files
        id: published
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          deploy/release/publish.sh "$VERSION" "$REGISTRY" keyless "$RUNNER_TEMP/image" "$RUNNER_TEMP/release"
          while read -r name reference; do
            case "$name" in
              image | chart)
                echo "${name}_name=${reference%@*}" >> "$GITHUB_OUTPUT"
                echo "${name}_digest=${reference#*@}" >> "$GITHUB_OUTPUT"
                ;;
            esac
          done < "$RUNNER_TEMP/release/pgsnare-$VERSION-digests.txt"
      - name: Record the build provenance of the files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/release/SHA256SUMS
      - name: Record the build provenance of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.published.outputs.image_name }}
          subject-digest: ${{ steps.published.outputs.image_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Record the build provenance of the chart
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.published.outputs.chart_name }}
          subject-digest: ${{ steps.published.outputs.chart_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Hand the files of the release to the job that verifies them
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30
      - name: Create the release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}/release
        run: |
          {
            echo "pgsnare $VERSION."
            echo
            echo "Verify it before use: docs/verifying-a-release.md in the repository says how."
            echo
            echo '```'
            cat "pgsnare-$VERSION-digests.txt"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          kind=()
          if [[ "$VERSION" == *-rc.* ]]; then
            kind=(--prerelease)
          fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "pgsnare $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${kind[@]}" ./*

  verify:
    name: verify
    needs: [check, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Take the files of the release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Install the verifying tools from the tool list
        run: deploy/tools/install.sh "$RUNNER_TEMP/bin" cosign crane
      - name: Log in to the registry, to read
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          crane auth login "${REGISTRY%%/*}" --username "$GITHUB_ACTOR" --password-stdin <<<"$REGISTRY_TOKEN"
      - name: Verify the files, the image and the chart as a user would
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          deploy/release/verify.sh "$VERSION" keyless release "$RUNNER_TEMP/release"
      - name: Verify the build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          deploy/release/verify.sh "$VERSION" keyless provenance "$RUNNER_TEMP/release"
