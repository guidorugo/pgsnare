# SPDX-License-Identifier: Apache-2.0
#
# Supply chain: advisories, bans, licences and sources of every dependency.
# Also runs nightly, because a new advisory can arrive without a push.

name: deny

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  deny:
    name: deny
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-image
      - run: make deny
