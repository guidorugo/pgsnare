# SPDX-License-Identifier: Apache-2.0
#
# Dependabot version updates for everything this repository pins.
#
# A new release is proposed only after it has been public for a week, which
# gives a compromised release time to be noticed. Security updates are not
# delayed by this.

version: 2

updates:
  # The workspace, and every fuzz crate with its own lock file.
  - package-ecosystem: cargo
    directories:
      - /
      - /crates/*/fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch

  # Workflows and the local composite actions. Actions stay pinned to a
  # commit SHA; Dependabot updates the SHA and the version comment together.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # The base image of Dockerfile.dev. A new Rust release also needs the same
  # version in rust-toolchain.toml; `make lint` fails until both agree.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # The PostgreSQL images of the integration tests.
  - package-ecosystem: docker-compose
    directory: /tests
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Every service tests one major version of PostgreSQL, so an image
      # is only ever updated within its major version: 15.19 to 15.20, and
      # never 15.19 to 18.6. Without this rule the newest image would be
      # proposed for every service, and the range of versions under test
      # would shrink to one. tests/itest.sh fails if a service does not
      # run the version it is named after. A new major version is added
      # by hand, as a service of its own.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # The images of deploy/Dockerfile. Its Rust image is the one of
  # Dockerfile.dev: the two are updated together, and `make lint` fails
  # until both agree with rust-toolchain.toml.
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # The images of the deployment tests: PostgreSQL, and the registry that
  # runs inside a CI job.
  - package-ecosystem: docker-compose
    directories:
      - /deploy/tests/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # As for the integration tests: PostgreSQL stays within its major
      # version, and a new major version is taken by hand.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # The images in the manifests of the Kubernetes tests. The node image of
  # the cluster is not updated here: it belongs to the release of `kind` in
  # deploy/tools/tools.txt and is changed together with it, by hand.
  - package-ecosystem: docker
    directory: /deploy/tests/kubernetes
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "kindest/node"

  # The images of the Compose example: PostgreSQL, and the Python image
  # of its webhook receiver. The image of pgsnare is given by digest when
  # the example is started.
  - package-ecosystem: docker-compose
    directory: /examples/compose
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # The stand-in application image of the sidecar definitions.
  - package-ecosystem: docker
    directory: /deploy/sidecar
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
