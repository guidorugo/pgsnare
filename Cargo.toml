[workspace]
resolver = "3"
# The members are pgsnare-proto, pgsnare-core and pgsnare. They are matched by
# a pattern because cargo ignores `exclude` for anything below a member that
# is listed by its full path, and the fuzz crates below must stay excluded.
members = ["crates/*"]
# Fuzz targets live next to the crate they exercise, in `crates/<crate>/fuzz/`.
# Each is a separate package with its own lock file, outside this workspace.
exclude = [
    "crates/pgsnare-proto/fuzz",
    "crates/pgsnare-core/fuzz",
    "crates/pgsnare/fuzz",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/guidorugo/pgsnare"
publish = false

[workspace.dependencies]
pgsnare-core = { path = "crates/pgsnare-core", version = "0.0.0", default-features = false }
pgsnare-proto = { path = "crates/pgsnare-proto", version = "0.0.0" }

aho-corasick = "1.1.5"
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys"] }
bytes = "1.12.1"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
hyper = { version = "1.12.0", default-features = false, features = ["http1", "client", "server"] }
proptest = "1.12.0"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "process", "system"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "signal", "sync", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt"] }
zeroize = "1.9.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
# A release build keeps integer overflow checks, and a panic unwinds so that
# it ends one session instead of the whole process.
overflow-checks = true
panic = "unwind"
